[project]
name = "google-scholar-mcp"
version = "0.1.0"
description = "A local stdio MCP server for Google Scholar publication and author profiles."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.0,<3",
    "scholarly2>=2.0,<3",
]

[project.scripts]
google-scholar-mcp = "google_scholar_mcp.server:main"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_scholar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
check-unannotated-defs = true
infer-return-types = "checked"
preset = "default"
project-includes = ["src"]
python-version = "3.14"
search-path = ["src"]
use-ignore-files = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "RUF", "UP"]
