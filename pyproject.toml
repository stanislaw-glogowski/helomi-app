[project]
name = "helomi-app"
version = "0.6.0"
description = "A local, privacy-first voice assistant for Apple Silicon Macs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0",
    "huggingface-hub>=1.29.0",
    "loguru>=0.7.3",
    "mlx-audio>=0.5.0",
    "mlx-whisper>=0.4.3",
    "mlx>=0.32.2",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0,<2",
    "openwakeword==0.6.0",
    "platformdirs>=4.11.5",
    "prompt_toolkit>=3.0.53",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "rumps>=0.4.0",
    "soxr>=1.0.0",
    "supertonic>=1.3.1",
    "uvicorn>=0.52.0",
    "voxcpm>=2.0.3",
]

[project.scripts]
helomi-cli = "helomi_cli.main:main"
helomi-tray = "helomi_tray.main:main"

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyrefly>=1.2.0",
    "ruff>=0.15.22",
    "types-pyyaml>=6.0.12.20260724",
    "types-pyaudio>=0.2.16.20260508",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-dependencies = [
    { package = { name = "openwakeword", version = "0.6.0" }, dependencies = ["tflite-runtime"] },
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/helomi_app",
    "src/helomi_cli",
    "src/helomi_common",
    "src/helomi_core",
    "src/helomi_tray",
]
artifacts = [
    "src/helomi_core/audio/avfaudio/bin/avfaudio",
]

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/helomi_core/audio/avfaudio/bin/avfaudio",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:torch.*:",
]
addopts = [
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]

[tool.coverage.run]
omit = [
    "*/avfaudio/*",
    "*/openwakeword/*",
    "*/parakeet/*",
    "*/silero_vad/*",
    "*/smart_turn/*",
    "*/supertonic/*",
    "*/voxcpm2/*",
    "*/whisper/*",
]

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

[tool.pyrefly]
check-unannotated-defs = true
infer-return-types = "checked"
preset = "default"
project-includes = ["hatch_build.py", "src"]
python-platform = "darwin"
python-version = "3.14"
replace-imports-with-any = ["mlx.core"]
search-path = ["src"]
use-ignore-files = true

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = []

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC110"]
