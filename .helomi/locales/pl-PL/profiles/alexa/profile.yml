name: Alexa

# Conversation roles use the same local model with task-specific limits.
conversation:
  models:
    fast:
      model_id: "mlx-community/gemma-4-26b-a4b-it-4bit"
      max_tokens: 256
      temperature: 0.15
    detailed:
      model_id: "mlx-community/gemma-4-26b-a4b-it-4bit"
      max_tokens: 512
      temperature: 0.25
    classifier:
      model_id: "mlx-community/gemma-4-26b-a4b-it-4bit"
      max_tokens: 8
      temperature: 0.0
  recent_messages: 8

# This profile waits for the Alexa wake word before accepting a turn.
wakeword:
  label: "Alexa"
  model_path: "alexa_v0.1.onnx"

# Gosia is the Polish Piper voice installed from the shared repository.
tts:
  model_path: "pl/pl_PL/gosia/medium/pl_PL-gosia-medium.onnx"
