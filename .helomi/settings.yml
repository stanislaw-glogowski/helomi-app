# Shared technical defaults for every locale. Locale settings may override these
# values, but must not define language. Use settings.override.yml for local-only
# machine settings; command-line --language and --profile win for one run.
language: "en-US"

profiles:
  default: null # Locale fallback when no profile is explicitly selected.
  selected: null # Skip the CLI picker or choose the desktop startup profile.

conversation:
  language_model:
    adapter: "mlx" # Local MLX models, or LangChain for an OpenAI-compatible endpoint.
  acknowledgement_delay: 0.6 # Delay before a prepared acknowledgement may play.
  wait_reaction_delay: 1.5 # Delay before a prepared wait reaction may play.

speech:
  audio:
    driver: "avfaudio" # Native macOS voice processing; pyaudio is a fallback.

  vad:
    adapter: "mlx:silero_vad" # Speech detector: mlx:silero_vad or openwakeword.
    threshold: 0.5 # Scores at or above this value count as speech.

  wakeword:
    adapter: "openwakeword"

  segmentation:
    min_start_speech_frames: 10 # Consecutive frames required to start an utterance.
    max_start_silence_frames: 150 # Silence frames allowed before speech starts.
    max_end_silence_frames: 18 # Trailing silence ending a regular utterance.
    short_utterance_speech_frames: 31 # Speech frames below which an utterance is short.
    short_utterance_end_silence_frames: 28 # Trailing silence ending a short utterance.
    max_utterance_frames: 1875 # Hard frame limit for one utterance.
    pre_roll_frames: 15 # Frames retained immediately before detected speech.

  turn_taking:
    sustained_barge_in_frames: 20 # 640 ms at 16 kHz with 512-sample frames.
    continuation_silence_frames: 38 # Silence while waiting for an incomplete turn.
    reaction_pause: 0.2 # Pause after a prepared acknowledgement or wait reaction.

  tts:
    adapter: "piper" # Speech synthesis: piper or mlx:chatterbox.
    repo_id: "rhasspy/piper-voices" # Piper voice repository.
    normalize_audio: true # Normalize generated samples before playback.
    volume: 1.0 # Output gain multiplier.

  stt:
    adapter: "mlx:parakeet-tdt" # mlx:parakeet-tdt, mlx:qwen3-asr, or mlx:whisper.
    model_id: "mlx-community/parakeet-tdt-0.6b-v3" # Default speech-to-text model.
